name: jmbr server image
description: >
  Build the sync-server image the way upstream's docker-release workflow does
  (Ubuntu image, linux/amd64 only) and check that it boots. Does not push.

inputs:
  tags:
    description: Extra image references to tag the result with, one per line
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up environment
      uses: ./.github/actions/setup
      with:
        cache: 'false'

    - name: Build web client and server
      run: yarn build:server
      shell: bash

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Build image
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: .
        file: packages/sync-server/docker/ubuntu.Dockerfile
        push: false
        load: true
        tags: |
          jmbr-actual-server:test
          ${{ inputs.tags }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

    - name: Check that the image boots
      shell: bash
      run: |
        docker run --detach --name jmbr-actual-server \
          --publish 127.0.0.1:5006:5006 jmbr-actual-server:test
        for _ in $(seq 60); do
          if curl --fail --silent http://127.0.0.1:5006/health; then
            echo
            curl --fail --silent http://127.0.0.1:5006/info
            echo
            docker rm --force jmbr-actual-server >/dev/null
            exit 0
          fi
          sleep 1
        done
        docker logs jmbr-actual-server
        exit 1
